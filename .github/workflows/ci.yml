name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-smoke-train:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -q

      - name: Run synthetic smoke experiment
        run: |
          python scripts/generate_smoke_data.py --rows 1000
          python scripts/train_baseline.py --config configs/baseline.yaml

